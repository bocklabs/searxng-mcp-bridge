name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          PRS='${{ steps.release.outputs.prs }}'
          if [ -z "$PRS" ] || [ "$PRS" = "[]" ]; then
            echo "No release PR found; nothing to merge."
            exit 0
          fi

          PR_NUMBER=$(echo "$PRS" | jq -r '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::error::Invalid release PR number."
            exit 1
          fi

          echo "Auto-merging release PR #$PR_NUMBER"
          # Prefer auto-merge so required checks can complete. Repositories
          # without branch protection reject --auto, so retry by merging
          # directly while GitHub computes mergeability.
          if gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" 2>&1; then
            echo "Auto-merge enabled or completed for PR #$PR_NUMBER."
            exit 0
          fi

          echo "--auto unavailable; merging directly with retry."
          for attempt in $(seq 1 12); do
            if gh pr merge --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"; then
              echo "Merged release PR #$PR_NUMBER."
              exit 0
            fi
            echo "Attempt $attempt/12: waiting for mergeability..."
            sleep 10
          done

          echo "::warning::Could not auto-merge release PR #$PR_NUMBER; merge it manually."

  publish:
    name: Publish Package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Use Node.js 25.x
        uses: actions/setup-node@v7
        with:
          node-version: '25.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm
        run: npm i -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate release version
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"

          if [[ "$RELEASE_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Release version ($RELEASE_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "Version consistency check passed for $PKG_VERSION"

      - name: Check whether npm version is already published
        id: npm-version
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is already published; skipping npm publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publishing (OIDC)
        if: ${{ steps.npm-version.outputs.should_publish == 'true' }}
        run: npm publish
